# The fast tier: what tests/run.sh --fast runs, and so what every
# office-src validation.sh runs, under bale's two minutes (TARBALL.md 7.6).
# The whole suite stays behind validation's --slow, and runs detached after
# every landing (tests/run.sh --detach).
#
# Defined here once, and held to the suite by tests/runner.py before
# anything runs: every name must be a test, a class or a module that
# unittest discover finds, and every verb bin/office's main() dispatches,
# and the walk-in, must have an entry point below. A session adds what it
# touched on its own command line (tests/run.sh --fast test_x.TestY), never
# here; it changes this file when it adds a verb, or when the tier's time
# needs it (times.tsv beside every run's logs says where the time goes).
#
# Chosen from the times of a whole run on 2026-10-12: for each verb, the
# cheapest test that types it and does its main work (a happy path where
# one costs seconds, not minutes); then every test that took under half a
# second (the units, the catalogs, the text rules: nearly free, and they
# guard most of what a careless change breaks), by class where the whole
# class is that cheap; then the suite's own rules (test_suite_clock) and
# the runner's tests, and the development record's pins (cheap; they read
# the sittings' pages).

budget_seconds = 120

# One test per verb, by its full id: it runs `office VERB` (the walk-in is
# `office` alone). tests/test_suite_clock.py checks that each one types it.
[entry_points]
