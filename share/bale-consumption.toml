# What the office reads from bale, and nothing else. Every bale verb and
# flag the office calls, every JSON key it reads, and the bale version
# the reads were written against. lib/office_bale.py builds each call's
# argv from this file and reads every key through one accessor that
# refuses a key not declared here; the test suite walks the reader's
# source against it and replays real bale output captured by a probe,
# so a bale release that moves a key fails a test, not a walk-in.
#
# The office reads bale only through these --json surfaces, in the
# project's directory, with stdin closed: never .bale/, never a prompt.
# It never writes what bale records. The surfaces after the reads run a
# bale verb when the occupant asks: office start makes a session and its
# context tarballs (pack, context, open), asking bale first whether a
# bundle can open (open_check, which writes nothing; open_json from bale
# 0.4.50 on), and office land lands one
# (apply, retry), carries a clarification back (relay), and ends a
# read-only sitting the office sent out (unlock). A datum the
# office needs and bale does not stamp is a slip for bale-src, never a
# scrape and never a guess (doctrine section 10); where bale prints a
# block for a person to carry and no --json key holds it, the office
# takes the lines between the markers declared here, and a moved marker
# fails a test.
#
# floor      the installed bale the surfaces were probed on. bale's key
#            contracts are additive (existing keys are never renamed or
#            removed), so every later bale should serve these reads; an
#            older one may not. office status reports a bale below the
#            floor as a line, never a refusal.
# checked    the latest bale every surface below was probed against again,
#            and the session whose probe did it. Nothing the office reads
#            had moved, so the floor and its captures stand; what that bale
#            added is written up beside the floor's captures, in the
#            development record's fixtures for that version.
# argv       the call, {placeholders} filled when it runs
# optional   flags added, in this order, when their value is given
# contract   where bale keeps the surface's key contract
# outcome    the value of the line's outcome key on success
# keys       every key the office reads: a.b is b inside a; a[].b is b
#            inside each element of the list a; a.*.b is b inside every
#            value of the map a

[bale]
floor = "0.4.45"
probed_in = "2026-09-30-read-side-001"
# bale 0.4.47 (the brief expected 0.4.46; 0.4.47 is what was installed):
# every key below resolved in its lines, the markers stand, and what it
# added is additive (status's clipboard object; a JSON line on unlock
# --json's refusal, which the office does not read). open --check is new
# to the office here, probed on 0.4.47 (it has had it since 0.4.45).
checked = "0.4.47"
checked_in = "2026-10-07-third-trip-001"

[surfaces.version]
argv = ["--version"]
format = "text"
pattern = '^bale (\d+\.\d+\.\d+)$'
contract = "bale --version: one line, bale X.Y.Z"

[surfaces.status]
argv = ["status", "--json"]
contract = "format_status_json's docstring, bin/bale_report.py"
outcome = "status"
keys = [
  "outcome",
  "version",
  "sessions",   # every open sid, oldest first
  "scopes",     # open sid -> its write forecast; [] marks a read-only session
  "outbox",     # every request tarball name: the fullest list of a repo's sids a surface carries
]

# The aggregate. --since DATE (ISO date, YYYY-MM-DD, inclusive, against
# each record's created_at; a timestamp is refused) narrows its membership
# to the sessions packed on or after that day: probed in
# 2026-10-06-drafting-table-digest-001 on bale 0.4.45, in office-src (a
# window holding applied sessions, one holding only an open one, one
# holding none, and composed with --work-class), in home-office and in
# every project home-office scopes. The keys after filters.since are the
# ones share/watch-queries.toml names; the office reads them through
# Reader.reach, which refuses a key not declared here.
[surfaces.stats]
argv = ["stats", "--json"]
optional = [["--work-class", "{work_class}"], ["--since", "{since}"]]
contract = "format_stats_json's docstring, bin/bale_report.py"
outcome = "stats"
keys = [
  "outcome",
  "filters",
  "filters.since",   # the window bale applied, held to the one asked for
  "classes",
  "classes.*.sessions",
  "classes.*.response_attempts",
  "classes.*.held_attempts",
  "classes.*.hold_rate",
  "classes.*.checks",
  "classes.*.checks_agree",
  "classes.*.checks_na",
  "classes.*.agreement_rate",
  "classes.*.bailout_sessions",
  "classes.*.sessions_with_response_attempt",
  "closure_mix",
  "closure_mix.applied",
  "doc_epochs",
  "doc_epochs.*.first_created_at",
  "doc_epochs.*.sessions",
  "doc_epochs.*.applied",
  "doc_epochs.*.in_flight",
  # share/watch-queries.toml's keys, read through Reader.reach
  "classes.*.unparsed_validated_attempts",
  "classes.*.validated_attempts",
  "classes.*.members.unparsed",
  "classes.*.forecast_entries_untouched",
  "classes.*.claim_basis",
  "classes.*.claim_basis.*.checks",
  "classes.*.claim_basis.*.agree",
  "members.clarification_self_only",
]

# One session. --work-class and --since are refused beside --sid.
[surfaces.dossier]
argv = ["stats", "--sid", "{sid}", "--json"]
contract = "format_session_dossier_json's docstring, bin/bale_report.py"
outcome = "dossier"
keys = [
  "outcome",
  "session_id",
  "found",
  "parse_failure",             # on found = false only
  "filtered_record_version",   # on found = false only
  "record",
  "record.created_at",
  "record.updated_at",
  "record.outcome",
  "record.work_class",
  "record.in_flight",
  "record.read_only",
  "record.closure",
  "record.closure.unlock_reason",
  "attempts",
  "attempts[].at",
  "attempts[].command",
  "attempts[].outcome",
  "attempts[].change_paths",
  "attempts[].validation",
  "attempts[].validation.state",
  "attempts[].validation.checks",
  "attempts[].validation.checks[].check",
  "attempts[].validation.checks[].claim",
  "attempts[].validation.checks[].verdict",
  "attempts[].validation.checks[].agreement",
  "attempts[].clarification",
  "attempts[].clarification.rounds",
  "attempts[].linkage",
  "attempts[].linkage.kind",
  "attempts[].linkage.point",
  "lineage",
  "lineage.superseded_by",
]

# Not a call: the subjects bale 0.4.45 gives the commits it makes in a
# repo, which the office reads from git to name the session that wrote a
# line (office moves, the desk) and to find the sessions that closed
# since a sitting (office digest), whose outcomes it then reads from
# their dossiers. A convention bale follows, not a contract it declares
# (a slip for bale-src); declared here so a change in it fails a test
# against the probe's captured subjects instead of turning a session's
# name into "commit abc1234". Probed in 2026-10-05-drafting-table-pages-001
# and 2026-10-06-drafting-table-digest-001.
#
# subjects   kind -> the subject's start, {sid} the session id; work is
#            the session's own changes, merge its landing, sweep its
#            telemetry record (applied, closed-read-only, swept_by SID)
[surfaces.commits]
calls = false
contract = "none: bale's habit as of 0.4.45 (a slip for bale-src asks for a declared shape or a dossier key)"
subjects = { work = "[bale {sid}] ", merge = "Merge bale {sid}", sweep = "[bale sweep {sid}] " }

# The two surfaces that make something, run only by office start when the
# occupant asks (the office is the occupant's hands at the terminal; it
# never schedules, never dispatches to a model and never carries pastes).
# Probed in 2026-10-02-friction-out-and-in-002 on bale 0.4.45, in
# throwaway repos.
#
# repeated   flags given once per element of a list value, in order
# switches   bare flags given when their value is true
# opener     the scissor lines bale prints around the session opener; the
#            --json report carries no opener, so office start takes the
#            lines between these from bale's stderr, verbatim (a slip for
#            bale-src: an opener key on the report)
#
# A session: the goal first, the slug, the folder's includes and forecast,
# the project constraint, a brief or --no-readme, the work class. A piped
# report of the same shape is what office sessions FOLDER - reads
# (lib/office_helper.py, sid_from_pack_report).
[surfaces.pack]
argv = ["pack", "{goal}", "--slug", "{slug}", "--json"]
optional = [["--readme-file", "{readme_file}"], ["--work-class", "{work_class}"]]
repeated = [["--include", "{includes}"], ["--write", "{writes}"], ["--constraint", "{constraints}"]]
switches = [["--no-readme", "{no_readme}"], ["--read-only", "{read_only}"]]
contract = "format_pack_json's docstring, bin/bale_report.py; bale pack --help names the keys"
outcome = "packed"
opener = ["--8<-- session opener (copy everything between the scissor lines) --8<--",
          "--8<-- end session opener --8<--"]
keys = [
  "outcome",
  "sid",       # the session id, recorded in the folder
  "tarball",   # the request tarball in the repo's .bale/outbox, copied into the out tray
]

# A context tarball: session-less, of the directory it runs in (the
# office, a ride-along's repo, a scratch copy of the doctrine). Under
# --context bale's include groups do not fire, so office start names the
# hung items itself.
[surfaces.context]
argv = ["pack", "--context", "--json"]
repeated = [["--include", "{includes}"]]
contract = "bale pack --help, --context (v0.4.39)"
outcome = "context-packed"
keys = [
  "outcome",
  "tarball",     # .bale/outbox/context-<dir>.tar.gz under the directory; overwritten on every run
  "tree_name",   # the one folder inside it
]

# A planner bundle: bale verifies it, gates its stored pack argv and
# replays it. Probed in 2026-10-03-friction-return-trip-001 on bale
# 0.4.45, in throwaway repos. open had no --json there and takes no flag
# beyond its own, so the bundle's pack argv is the whole forecast: the
# office adds nothing to it and answers none of its intents. The report is
# all on stdout. The new session's id is read from bale status --json, the
# sessions open after the open that were not open before; the request
# tarball is the path on the report's tarball line, checked against the
# status outbox; the opener is between the same scissor lines as the
# pack's. This form serves a bale below open_json's since (below); from
# that bale on, open_json does.
#
# tarball_line      the report line that names the request tarball's path
# second_desk_since the first bale that joins a bundle whose session is
#                   still open as a second desk and opens none: the open
#                   set then does not move, and this form cannot say which
#                   session the bundle joined
[surfaces.open]
argv = ["open", "{bundle}"]
format = "text"
contract = "bale open --help (v0.4.45)"
opener = ["--8<-- session opener (copy everything between the scissor lines) --8<--",
          "--8<-- end session opener --8<--"]
tarball_line = "  tarball:        "
second_desk_since = "0.4.44"

# The same open with --json (bale 0.4.48; the second desk's tarball key
# since 0.4.50), used when the bale where the bundle opens is at since or
# later. One JSON line on stdout; every [bale] line, the second-desk
# summary and the opener's scissor block go to stderr. outcome "opened"
# is a real open (a sid minted; the replayed pack's own values); outcome
# "second-desk" is a bundle whose session was still open, joined as one
# more desk: sid is the joined session, opener that desk's paste text (LF
# joined, one trailing LF), tarball the request desk one opened with, or
# null when it is no longer in the outbox. The office holds the line to
# bale status's open set before and after (lib/office_bale.py,
# open_bundle). Read from format_open_json's docstring in bale 0.4.52's
# bin/bale_report.py, which owns the key contract, by the probe of session
# 2026-10-13-doctrine-core-001, which found that the audience-line bundle
# opened on 2026-10-08 was joined as a second desk on 2026-10-12. Live
# lines on 0.4.52, opened and second-desk, were captured by the fallback
# probe of session 2026-10-13-office-probe-002 (fixtures/bale-0.4.52/
# open-json/); every key below is in them, and the suite's fake replays
# them.
#
# since     the first bale whose open --json serves every key below
# outcomes  the outcomes of a run that exits 0 having opened or joined one
[surfaces.open_json]
argv = ["open", "{bundle}", "--json"]
since = "0.4.50"
contract = "format_open_json's docstring, bin/bale_report.py (read on 0.4.52; captured live on 0.4.52)"
outcomes = ["opened", "second-desk"]
opener = ["--8<-- session opener (copy everything between the scissor lines) --8<--",
          "--8<-- end session opener --8<--"]
keys = [
  "outcome",
  "sid",       # the session minted, or the one a second desk joined
  "tarball",   # the request's absolute path; null on a second desk whose request left the outbox
  "opener",    # the paste text, LF-joined; when not a string, the scissor block on stderr is read
]

# Asked before office start writes anything, for a planner bundle: bale
# open --check where the bundle opens, stdin closed. bale resolves a bare
# name through its own search (cwd first, then apply.search_paths),
# verifies the bundle and runs every gate it runs before an open (forecast
# existence and disjointness among them), and writes nothing. Exit 0 when
# every gate passed, with a rehearsal report on stdout whose first line
# names the path bale found; exit 1 with bale's error on stderr for a name
# it cannot find (every directory searched listed) or a gate that refuses.
# Outside a repo it refuses. Probed in 2026-10-07-third-trip-001 on bale
# 0.4.47, in throwaway repos, with the repo's git status, .bale/ listing
# and open sessions the same before and after.
#
# found_line  the start of the report line naming the bundle's path; the
#             path runs to " against "
[surfaces.open_check]
argv = ["open", "--check", "{bundle}"]
format = "text"
contract = "bale open --help (--check since v0.4.45; probed on v0.4.47)"
found_line = "[bale] bale open --check: rehearsing planner bundle "

# The same rehearsal with --json (0.18.0), used where the bale the bundle
# opens with is at open_json's since: one JSON line on stdout on exit 0
# (outcome "rehearsed") and on a refusal, exit 1 (outcome
# "open-refused", with a reason code from a closed vocabulary and the
# refusal's first line as cause); the rehearsal report and bale's error
# go to stderr. Captured live on bale 0.4.52 by the fallback probe of
# session 2026-10-13-office-probe-002, in a throwaway repo
# (fixtures/bale-0.4.52/open-json/). What it settled: a bundle whose
# session is still open rehearses as "rehearsed", exit 0, its line byte
# for byte a fresh bundle's, and `rehearsal` is only the kind ("check");
# bale says which session it would join as a desk on stderr alone, in
# the second_desk_line below, which the office shows the occupant and
# never decides on. Another bundle overlapping that session's forecast
# is "open-refused", reason "gate-refused". office start takes bale's
# outcome as the verdict on an overlap its own check found (the ruling
# that a second desk is bale's to recognize: lib/office_bale.py,
# check_bundle_report).
#
# outcome_passed    the outcome of a rehearsal that passed, exit 0
# refused           the outcome of a refusal, exit 1
# second_desk_line  the start of bale's stderr line naming the open
#                   session a second desk would join
[surfaces.open_check_json]
argv = ["open", "--check", "--json", "{bundle}"]
since = "0.4.50"
contract = "format_open_json's docstring, bin/bale_report.py (captured live on 0.4.52)"
outcome_passed = "rehearsed"
refused = "open-refused"
second_desk_line = "[bale] second desk: "
keys = [
  "outcome",
  "rehearsal",     # "check" on a rehearsal that passed; null on a refusal
  "bundle",        # {path, sha256, stem}; null on a refusal before bale read the file
  "bundle.path",   # the bundle's absolute path, as bale resolved it
  "reason",        # on open-refused, the refusal's code (gate-refused for an overlap)
  "cause",         # on open-refused, the refusal's first line
]

# Landing a response: run in the repo the session belongs to, with stdin
# the occupant's own terminal, so every question bale asks (an admission,
# the walkthrough's merge or revert, a hook) reaches him as bale asks it;
# the office answers none. stdout is copied to the terminal as it comes
# and kept for the relay blocks; stderr is the terminal's. Probed in
# 2026-10-03-friction-return-trip-001. The outcome is read from the
# session's dossier afterwards, never from these lines: the attempt
# apply or retry added, or, when bale exits 0 and added none, a
# clarification round (bale relay re-emits its block).
#
# On a project on a host (since 0.16.0, session
# 2026-10-08-return-trip-to-host-001) apply and retry run in the
# project's repo there, through the attended form of its shell (ssh -tt,
# a container's -it; piped, the plain form with stdin closed), with the
# tarball argument the path of the copy the office carried into its one
# temporary directory on the host; the same command removes that
# directory once bale exits, and exits with bale's code. Nothing bale
# prints is changed by the trip; through a pseudo-terminal its lines end
# in CR LF, and the office rewrites the capture with LF before it reads
# the blocks. The host's bale was 0.4.51 when this was built, the same as
# the packing machine's; the surfaces were read from its help, not probed
# again there.
#
# interactive   stdin, and stderr, stay the occupant's terminal
# relay         the lines around each block bale prints for a person to
#               carry, {sid} filled in; the block's addressee follows
#               "to " on the BEGIN line (worker, planner). The --json
#               report has no relay key (a slip for bale-src), so the
#               office takes the blocks from between these, verbatim
# outcomes      the attempt outcomes the office words; any other is
#               shown as bale records it
[surfaces.apply]
argv = ["apply", "{tarball}"]
format = "text"
interactive = true
contract = "bale apply --help (v0.4.45)"
relay = ["=== RELAY BEGIN {sid} to ", "=== RELAY END {sid} to "]
outcomes = ["applied", "held", "base-drift-refused", "scope-drift-refused", "required-check-refused",
            "reverted", "bailout"]

# A held session's corrected response: the same pipeline, the same
# session id.
[surfaces.retry]
argv = ["retry", "{tarball}"]
format = "text"
interactive = true
contract = "bale retry --help (v0.4.45)"

# A clarification's paste block for the planner, re-emitted from the
# thread's latest round. With no file it records nothing; the block is
# the whole of stdout. On a host (since 0.16.0) it runs there, in the
# same connection as the session's dossier; the planner's answer goes
# back by `bale relay SID -` there, the answer file on the occupant's
# machine piped to it, a line office land prints and never runs.
#
# block   the block's first and last lines, {sid} filled in
[surfaces.relay]
argv = ["relay", "{sid}"]
format = "text"
contract = "bale relay --help (v0.4.22)"
block = ["BALE EXCHANGE BEGIN {sid}", "BALE EXCHANGE END"]

# A planner's answer carried back (office relay, 0.17.0): bale relay
# SID - with the answer file on its stdin, in the repo the session is
# open in (through the project's shell for a hosted one; the file never
# travels on its own). bale verifies the block's trailer, records the
# round and prints the worker-facing block on stdout, which the office
# prints whole and copies; a refusal is bale's exit 1 and its words.
# Read on 0.4.51 (bale relay --help); asks nothing, so stdin is the file.
[surfaces.relay_answer]
argv = ["relay", "{sid}", "-"]
format = "text"
contract = "bale relay --help (v0.4.22; the stdin form)"

# Ending a read-only sitting: office land SID on a read-only session a
# folder records, and on no other session (the ruling of sitting
# 2026-10-03-plan-4b-sitting-001, extending the 2026-10-01 ruling on pack
# and apply to this one case). Probed in 2026-10-04-friction-second-trip-001
# on bale 0.4.45, in a throwaway repo: unlock asks nothing, on a terminal
# or piped, so it runs with stdin closed like a read. bale infers the
# reason, closed-read-only, from the empty scope, and its sweep commits
# the session's telemetry record alone, as
# `[bale sweep SID] closed-read-only`, leaving any other change in the
# tree as it was. The human summary is on stderr. Since 0.4.47 a refusal
# also prints one JSON line on stdout (outcome unlock-refused, a reason
# code), still exiting 1 with the error on stderr; the office reads a
# refusal by its exit code and bale's words, as before. On a host
# (since 0.16.0) it runs there, through the project's shell.
[surfaces.unlock]
argv = ["unlock", "{sid}", "--json"]
contract = "format_unlock_json's docstring, bin/bale_report.py; bale unlock --help (v0.4.45; checked on v0.4.47)"
outcome = "unlocked"
keys = [
  "outcome",
  "closure_reason",   # closed-read-only for a read-only session
  "sweep",
  "sweep.status",     # committed when bale committed the record
  "sweep.detail",     # bale's words for what its sweep did
]

# Not a bale verb: the install scripts every bale release ships, which
# office projects level-bale runs on a hosted project's host (only when
# the occupant asks) to put there the bale this machine runs. A release
# install sits at <install>, bin/bale on the login PATH through a link;
# the office sends a release-shaped tarball of this machine's install
# (one top-level bale/ directory; user/, dot-entries and caches left out)
# and runs the host's own <install>/upgrade.sh with these flags on it:
# upgrade.sh moves <install>/user/ aside, replaces the rest, puts user/
# back and runs install.sh -y, which runs validate.sh. A host with no bale
# on its login PATH gets the tarball unpacked in its home and the
# first-install script run. Read on 0.4.51 in the probe of session
# 2026-10-07-out-trip-to-host-004 (upgrade.sh and install.sh in full);
# the host's 0.4.40 copy was not read: its flags are the header's, and an
# upgrade.sh that does not take -y refuses before it changes anything,
# which the office reports in its words. The development record's
# fixtures for bale-0.4.40 keep what that probe captured from the host's bale.
#
# script        the upgrade script, relative to the install
# flags         given before the tarball
# first_install the install script of a first install, relative to the
#               unpacked install, and its flags
[surfaces.upgrade]
calls = false
format = "text"
contract = "upgrade.sh's header (read on 0.4.51); a release tarball holds one directory with bin/bale"
script = "upgrade.sh"
flags = ["-y"]
first_install = ["install.sh", "-y"]
