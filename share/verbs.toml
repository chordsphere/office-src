# What each verb is, what it ships, where it lands, whether a person must
# be present and what may set it off. The office command reads the built
# verbs from here as they arrive. A verb never schedules a session, never
# dispatches one to a model and never carries pastes. When the occupant
# asks, office start runs bale's pack for an office-session or
# project-session kind: the office is the occupant's hands at the
# terminal, and bale carries the session.
#
# kind      script | office-session | project-session
# built     whether the office command has it yet
# ships     what rides with the session (office sessions also ship the
#           hung items, which the office's bale.toml include group pulls,
#           and the doctrine)
# writes    where it may land: paths, patterns, or prose where the verb
#           writes something no path names
# lands     what is guaranteed to exist, created or changed, after the
#           verb succeeds: paths or patterns, each inside one of the
#           verb's writes; [] when nothing is guaranteed. Lands means
#           exists after: a verb that moves a folder lands where the
#           folder ends up, not the place it left (close lands
#           filing-cabinet/{folder} alone), and a verb whose entries are
#           alternatives (open, sessions) lands one of them.
# attended  true when a person must be present while it runs (answering,
#           carrying, deciding); false when it can run with nobody there
# trigger   what may set it off, a list from a closed vocabulary:
#           manual, before-sitting, after-sitting, after-build, on-hold,
#           on-correctable-hold, schedule. What a schedule is, its cadence
#           and where it is declared, is not the office's to say; the
#           office only says a verb may be scheduled.
#
# The rule: no declared landing, no unattended spawn. A session-kind verb
# (office-session, project-session) with attended = false must have a
# non-empty lands. The test suite refuses a catalog that breaks it and
# office status reports one in the installed catalog. Scripts declare
# the keys too, for parity and for the shell, but spawn nothing.
#
# A pattern's braces stand for a value filled in when the verb runs:
# desk/{folder}, notepad/{date}-{slug}.md. A lands entry falls inside a
# writes entry when it is that path or a path under it, a placeholder
# segment in writes standing for any segment.
#
# Nothing in the office command consumes lands, attended or trigger yet
# beyond the check. The consumers are whoever spawns sessions (a
# harness, before it spawns anything) and the shell; the keys are
# declared now so this catalog is a registry they can walk. A declared
# kind with built = false is a registry entry, not a verb the command
# has; it arrives by hand a few times before the command learns it.

[verbs.init]
kind = "script"
built = true
writes = ["the new office"]
lands = ["floor-plan/manifest.toml", "profile.md"]
attended = true
trigger = ["manual"]

# The founding door for an office that exists (office init runs the same
# code after it builds one): the profile's questions, the timezone written
# to the floor plan when it resolves, the founding folder with the answers
# kept in it, and the founding session out through office start. Lands
# the folder's answers; the floor plan changes only when the zone does,
# and the session is office start's.
[verbs.found]
kind = "script"
built = true
writes = ["desk/{folder}", "floor-plan/manifest.toml"]
lands = ["desk/{folder}/answers.md"]
attended = true
trigger = ["manual"]

[verbs.survey]
kind = "script"
built = true
writes = ["floor-plan/survey.md"]
lands = ["floor-plan/survey.md"]
attended = true
trigger = ["manual"]

[verbs.status]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

[verbs.upgrade]
kind = "script"
built = true
writes = ["live structure named by each migration", "floor-plan/manifest.toml"]
lands = ["floor-plan/manifest.toml"]
attended = true
trigger = ["manual"]

[verbs.where]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

[verbs.default]
kind = "script"
built = true
writes = ["the per-machine default office setting"]
lands = []
attended = true
trigger = ["manual"]

[verbs.note]
kind = "script"
built = true
writes = ["notepad"]
lands = ["notepad"]
attended = true
trigger = ["manual"]

# One new page per slip, committed on its own.
[verbs.slip]
kind = "script"
built = true
writes = ["suggestion-box/{date}-{slug}.md"]
lands = ["suggestion-box/{date}-{slug}.md"]
attended = true
trigger = ["manual"]

# One new page per drop in the in-tray, committed on its own (0.19.0). The
# in-tray arrives with the first drop, as the drafting table arrives with
# the first verb that writes it: its front page, the floor plan's entry
# and bale.toml's trigger, committed with that drop. Lands the page.
[verbs.drop]
kind = "script"
built = true
writes = ["in-tray/{date}-{slug}.md", "in-tray/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["in-tray/{date}-{slug}.md"]
attended = true
trigger = ["manual"]

# open writes one folder: on the desk, or in the filing cabinet when it
# is born done (--filed); lands names both, one of which it lands.
# open writes one folder (and, with --goal, its goal field, 0.20.0).
[verbs.open]
kind = "script"
built = true
writes = ["desk/{folder}", "filing-cabinet/{folder}"]
lands = ["desk/{folder}", "filing-cabinet/{folder}"]
attended = true
trigger = ["manual"]

[verbs.desk]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

[verbs.week]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

# close moves one folder and, with --into or --split, adds a line to
# each successor's folder.md, on the desk or in the cabinet. It writes
# both places and lands the cabinet alone: the folder exists there after.
[verbs.close]
kind = "script"
built = true
writes = ["desk/{folder}", "filing-cabinet/{folder}"]
lands = ["filing-cabinet/{folder}"]
attended = true
trigger = ["manual"]

[verbs.reopen]
kind = "script"
built = true
writes = ["filing-cabinet/{folder}", "desk/{folder}"]
lands = ["desk/{folder}"]
attended = true
trigger = ["manual"]

# A harness also runs sessions when it packs or applies, so it is the
# one script that runs with nobody there.
[verbs.sessions]
kind = "script"
built = true
writes = ["desk/{folder}/folder.md", "filing-cabinet/{folder}/folder.md"]
lands = ["desk/{folder}/folder.md", "filing-cabinet/{folder}/folder.md"]
attended = false
trigger = ["manual", "after-build"]

# Lists the projects the office scopes and renders what bale records
# about them, reading only; `office projects add` and `office projects
# set` are the only writers of the floor plan's [projects] table, set
# writing what rides with a project and what runs after it lands. Outside
# the office, and never in it, add --from makes a clone on a project's
# host and level-bale replaces the bale install there (both only when the
# occupant asks); neither lands anything in the office.
[verbs.projects]
kind = "script"
built = true
writes = ["floor-plan/manifest.toml"]
lands = ["floor-plan/manifest.toml"]
attended = true
trigger = ["manual"]

# Packs a session for a folder: in the office (the work kind, or a
# sitting with --read-only) or on a project (the build kind), or opens a
# planner's bundle in either place. It records the session in the
# folder, opens one first when asked for a new job, and files each page
# of a sitting's words the brief carries as its own notepad page; what
# it writes outside the office is bale's registry where the pack runs and
# the out tray on this machine. Before it packs it surveys the machine
# again and commits the page, so the hung survey is never older than the
# session that reads it. A bundle is checked with bale open --check where
# it opens before anything is written. The riders the pack's forecast
# carries are offered and carried into the folder before the pack. Every
# session it sends out carries the in-tray's unsorted drops (0.19.0);
# with --drop it mints the folder through office open's code and moves
# the drop's page out of the in-tray into the folder's drops/.
[verbs.start]
kind = "script"
built = true
writes = ["desk/{folder}", "in-tray/{date}-{slug}.md", "notepad/{date}-{slug}.md", "floor-plan/survey.md", "drafting-table/riders.md",
          "drafting-table/moves.md", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml",
          "bale's registry where the session is packed", "the out tray"]
lands = ["desk/{folder}/folder.md"]
attended = true
trigger = ["manual"]

# Lands a session: bale apply (or retry, for a held one) in the repo it
# belongs to, then, once bale has applied it, the project's after-land
# actions and the planner's ratification in the folder. An office
# session's folder record is taken out while bale lands and put back
# after. A read-only sitting the office sent out is ended instead: bale
# unlock in its repo, and an ended line in its folder's History. After an
# applied landing it also closes the founding folder when the founding
# session landed with the profile complete, and runs watches check
# (without --record), printing any fired line.
# Nothing is guaranteed to exist after it: a HOLD lands nothing.
[verbs.land]
kind = "script"
built = true
writes = ["the repo the session belongs to, through bale's apply (or, for a read-only sitting, bale's unlock)", "desk/{folder}/folder.md",
          "desk/{folder}/walkthrough.md", "desk/{folder}/delivery.md",
          "filing-cabinet/{folder}", "in-tray", "desk", "handbook", "floor-plan/manifest.toml", "bale.toml",
          "drafting-table/moves.md", "what office moves writes", "what the project's after-land actions write"]
lands = []
attended = true
trigger = ["manual"]

# The audience line (0.17.0). deliver carries a folder's landed work to
# its project's audience as a delivery branch of curated commits, the
# words from the folder's delivery.md, and records the delivery in the
# folder's History; outside the office it writes that branch on the
# audience's git host, the push guard in the clone's .git/hooks when it
# is missing, and a temporary repo on this machine, removed after.
# Nothing is guaranteed to exist after it: a letterhead hit, a conflict
# or a refused push leaves nothing pushed and nothing recorded.
[verbs.deliver]
kind = "script"
built = true
writes = ["desk/{folder}/folder.md", "filing-cabinet/{folder}/folder.md", "a delivery branch on the project's audience",
          "the push guard in the clone's .git/hooks"]
lands = []
attended = true
trigger = ["manual"]

# Read-only: the letterhead's guard on what leaves, run by hand on a
# tree here or in a project's repo; office deliver runs the same check
# before anything is pushed.
[verbs.letterhead-check]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

# Carries a planner's answer to a clarification back to the repo the
# session is open in: bale relay there, the answer file on its stdin.
# What it writes is bale's own exchange record, under .bale/ in that repo.
[verbs.relay]
kind = "script"
built = true
writes = ["bale's exchange thread in the repo the session is open in"]
lands = []
attended = true
trigger = ["manual"]

# Runs a worker's probe block where the folder's project lives (0.18.0):
# in its repo here, through its shell on a host, or in the office root,
# after showing the block's header and asking once. What it writes is the
# folder's History line, and the fallback's probe-output/ carried into the
# session's out tray on this machine (outside every office) and removed
# where it ran; whatever the block itself prints is its own, and a block
# that does not say it is read-only is refused. Nothing is guaranteed to
# exist after it: a refused or declined probe writes nothing.
[verbs.probe]
kind = "script"
built = true
writes = ["desk/{folder}/folder.md", "the session's out tray on this machine"]
lands = []
attended = true
trigger = ["manual"]

# The toy drawer: a throwaway office in a temporary directory, built,
# walked through and deleted before the verb ends, so nothing it writes
# exists after it. It never writes an office, this machine's default
# office setting, the walk-in record or any bale registry, and runs no
# bale: start and land are shown, never run.
[verbs.tour]
kind = "script"
built = true
writes = ["a throwaway office in a temporary directory, deleted before the tour ends"]
lands = []
attended = true
trigger = ["manual"]

# The drafting table's verbs (the blueprint's section 3). Every verb that
# writes the drafting table may be the one it arrives with: its front
# page from the install's template, the floor plan's entry and bale.toml's
# include-group trigger, committed with the write that asked for them, so
# those three are in its writes (and in no lands: they exist already
# after the first). A two-word verb's key is hyphenated.

# Applies the in-tray's sorted drops (0.20.0), then a sitting's desk moves,
# through office open, office close and the gate flags; a script a
# harness may run after a sitting lands, and office land runs after a
# landing that sorted a drop.
[verbs.moves]
kind = "script"
built = true
writes = ["in-tray", "desk", "filing-cabinet", "drafting-table/moves.md", "drafting-table/blueprints/{id}/blueprint.md",
          "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["drafting-table/moves.md"]
attended = false
trigger = ["after-sitting", "manual"]

[verbs.blueprint-open]
kind = "script"
built = true
writes = ["drafting-table/blueprints/{id}", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["drafting-table/blueprints/{id}/blueprint.md"]
attended = true
trigger = ["manual"]

[verbs.blueprint-ratify]
kind = "script"
built = true
writes = ["drafting-table/blueprints/{id}/blueprint.md"]
lands = ["drafting-table/blueprints/{id}/blueprint.md"]
attended = true
trigger = ["manual"]

[verbs.rider-add]
kind = "script"
built = true
writes = ["drafting-table/riders.md", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["drafting-table/riders.md"]
attended = true
trigger = ["manual"]

# The rider moves into the folder and a pointer stays on the page.
[verbs.rider-carry]
kind = "script"
built = true
writes = ["drafting-table/riders.md", "desk/{folder}/folder.md"]
lands = ["desk/{folder}/folder.md", "drafting-table/riders.md"]
attended = true
trigger = ["manual"]

# The folder that carries the rider, on the desk or in the cabinet; lands
# names both, one of which it lands.
[verbs.rider-consumed]
kind = "script"
built = true
writes = ["desk/{folder}/folder.md", "filing-cabinet/{folder}/folder.md"]
lands = ["desk/{folder}/folder.md", "filing-cabinet/{folder}/folder.md"]
attended = true
trigger = ["manual"]

# Read-only; --forecast PATH... is what a sitting runs when it writes a
# pack line.
[verbs.riders]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

[verbs.agenda-add]
kind = "script"
built = true
writes = ["drafting-table/agenda.md", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["drafting-table/agenda.md"]
attended = true
trigger = ["manual"]

# Writing either ledger is a sitting's; these only read.
[verbs.rulings]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

[verbs.evidence]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

# Read-only: the register, each watch's state read from its log.
[verbs.watches]
kind = "script"
built = true
writes = []
lands = []
attended = true
trigger = ["manual"]

# Writes nothing without --record; with it, a fired record for each watch
# that fired, on the watch log (made from its template, and the drafting
# table with it, on the first write). What it lands is a report, and a
# record only when a watch fired, so lands guarantees no path. Its
# after-build trigger is office land: after an applied landing, land runs
# it without --record and prints only the lines of the watches that fired.
[verbs.watches-check]
kind = "script"
built = true
writes = ["drafting-table/watch-log.md", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = []
attended = false
trigger = ["before-sitting", "after-build", "manual"]

# The sitting-open page, rewritten whole on every run like the survey;
# office start runs it before it packs a sitting. The blueprint's section
# 3 departs from the seed here: everything on the page is computed, so it
# is a script, not a session kind.
[verbs.digest]
kind = "script"
built = true
writes = ["drafting-table/digest.md", "drafting-table/README.md", "floor-plan/manifest.toml", "bale.toml"]
lands = ["drafting-table/digest.md"]
attended = false
trigger = ["before-sitting", "manual"]

[verbs.founding]
kind = "office-session"
built = true
ships = ["desk/{folder}", "floor-plan"]
writes = ["desk/{folder}", "profile.md", "notepad", "floor-plan"]
lands = ["profile.md", "notepad/{date}-{slug}.md", "floor-plan/manifest.toml"]
attended = true
trigger = ["manual"]

# Packed by office start, in the office.
[verbs.work]
kind = "office-session"
built = true
ships = ["desk/{folder}", "handbook/{systems}", "rolodex/{people}", "letterhead"]
writes = ["desk/{folder}"]
lands = ["desk/{folder}/folder.md"]
attended = true
trigger = ["manual"]

# Packed by office start, on a project. Attended until a build kind
# with a declared landing is proven by hand. Since 0.17.0 the two
# deliverables of doctrine section 3, principle 6, are the session's to
# write and the folder's to hold: the walkthrough and the delivery words,
# written as the Walkthrough and Delivery sections at the end of the
# response's notes.md (the install's templates ride with the session to
# say their shape) and filed in the folder as walkthrough.md and
# delivery.md by office land after the landing, the office step that
# brings the folder up to date (doctrine section 4); the session never
# writes into the office. lands names what exists after a build session
# that wrote both has landed; writes names the folder for it.
[verbs.build]
kind = "project-session"
built = true
ships = ["desk/{folder}", "handbook/{systems}", "templates/walkthrough.md and templates/delivery.md, from the install"]
writes = ["{project}", "desk/{folder}"]
lands = ["desk/{folder}/walkthrough.md", "desk/{folder}/delivery.md"]
attended = true
trigger = ["manual"]

# The standalone sort (0.20.0), packed by office start --sort in the
# office: it belongs to no folder. It ships every folder's folder.md, every
# handbook chapter, the unsorted drops (in its brief and its request), the
# hung items and the doctrine; it writes notes.md, which office land files,
# and the notepad and, with a drafting table, the moves page. Nothing is
# guaranteed to exist after it: a sort that judges no drop lands nothing.
[verbs.sort]
kind = "office-session"
built = true
ships = ["desk/{folder}/folder.md, every folder's", "filing-cabinet/{folder}/folder.md, every folder's", "handbook",
         "in-tray/{date}-{slug}.md, every unsorted drop", "templates/sort-brief.md, as the brief"]
writes = ["notepad", "drafting-table/moves.md"]
lands = []
attended = true
trigger = ["manual"]

[verbs.prep]
kind = "office-session"
built = false
ships = ["clipboards/{series}", "handbook/{systems}", "rolodex/{attendees}"]
writes = ["clipboards/{series}"]
lands = ["clipboards/{series}"]
attended = true
trigger = ["manual"]

[verbs.meeting]
kind = "office-session"
built = false
ships = ["clipboards/{series}", "handbook/{systems}", "rolodex/{attendees}"]
writes = ["clipboards/{series}", "desk"]
lands = ["clipboards/{series}"]
attended = true
trigger = ["manual"]

[verbs.renovate]
kind = "office-session"
built = false
ships = ["floor-plan", "suggestion-box"]
writes = ["floor-plan", "suggestion-box", "{spaces being changed}"]
lands = ["floor-plan/manifest.toml"]
attended = true
trigger = ["manual"]

# The kinds below are declared ahead of the command: a registry for the
# shell and for whoever spawns sessions, built by hand until the verbs
# session and the harness build them.

[verbs.sitting]
kind = "office-session"
built = false
ships = ["drafting-table", "desk"]
writes = ["drafting-table", "notepad"]
lands = ["notepad/{date}-{slug}.md"]
attended = true
trigger = ["manual"]

[verbs.chat]
kind = "office-session"
built = false
ships = ["desk/{folder}"]
writes = ["desk/{folder}"]
lands = ["desk/{folder}/transcript.md"]   # where it lands is Q-3, open
attended = true
trigger = ["manual"]

[verbs.cleanup]
kind = "office-session"
built = false
ships = ["desk", "notepad", "suggestion-box", "handbook", "drafting-table/riders.md"]
writes = ["desk", "filing-cabinet", "handbook", "rolodex", "calendar", "suggestion-box", "drafting-table/riders.md"]
lands = ["desk/{folder}/folder.md"]
attended = false
trigger = ["after-build", "after-sitting", "schedule"]

# A sitting scoped to one blueprint (the blueprint's section 3.3), sent
# out by office blueprint close through office start's own code: a folder
# born for the close records it, and the close report's template rides
# from the install beside the request.
[verbs.blueprint-close]
kind = "office-session"
built = true
ships = ["drafting-table/blueprints/{id}", "desk/{member folders}", "drafting-table/rulings.md", "drafting-table/evidence.md", "drafting-table/watches.md", "the close report's template"]
writes = ["drafting-table", "notepad", "desk/{folder}"]
lands = ["drafting-table/blueprints/{id}/close.md", "notepad/{date}-{slug}.md"]
attended = true
trigger = ["manual"]

[verbs.review]
kind = "project-session"
built = false
ships = ["the held staging diff", "the HOLD's evidence"]
writes = ["{project}"]
lands = []        # seed: a triage record (correctable, escalate, fixture defect); twine-src places it
attended = true
trigger = ["on-hold"]

[verbs.check]
kind = "project-session"
built = false
ships = ["the landed change", "the brief"]   # never the oracle
writes = ["{project}"]
lands = []        # seed: an independent verdict as a claims block; twine-src places it
attended = true   # seed: false, once lands names a path (the rule below)
trigger = ["after-build"]                     # by policy (effort); Q-6

[verbs.retry]
kind = "project-session"
built = false
ships = ["the failure context", "the spec"]   # never oracle mechanics (PLANNER.md §5)
writes = ["{project}"]
lands = []        # seed: the corrected response, with corrects: lineage; twine-src places it
attended = true   # seed: false, once lands names a path
trigger = ["on-correctable-hold"]
