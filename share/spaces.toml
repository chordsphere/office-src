# The spaces an office can have. office init builds every space marked
# base = true; the others arrive by renovation when real work asks for
# them, except the drafting table, which arrives with the first verb that
# writes it, and the in-tray, which arrives with the first office drop
# (each entry below is what that verb copies into the floor plan).
# doctrine/OFFICE.md section 5 says what each space is for.
#
# path   where the space lives inside the office
# base   built by office init
# hung   shipped with every office session: true for the whole space, or
#        a list of paths inside it
# filed  filed paper: never rewritten by a migration, and grown only at
#        its end (doctrine section 15). true for the whole space, or a
#        list of paths inside it; a path may hold a glob, as git reads
#        one, for pages a space files under many directories

[spaces.profile]
path = "profile.md"
base = true
hung = true

[spaces.floor-plan]
path = "floor-plan"
base = true
hung = ["floor-plan/survey.md"]

[spaces.desk]
path = "desk"
base = true

[spaces.filing-cabinet]
path = "filing-cabinet"
base = true
filed = true

[spaces.notepad]
path = "notepad"
base = true
filed = true

[spaces.suggestion-box]
path = "suggestion-box"
base = true

[spaces.drawer]
path = "drawer"
base = true

[spaces.handbook]
path = "handbook"
hung = ["handbook/README.md"]

[spaces.clipboards]
path = "clipboards"

[spaces.calendar]
path = "calendar"
hung = true

[spaces.rolodex]
path = "rolodex"

[spaces.letterhead]
path = "letterhead"

# Part live, part filed: the ledgers and the close reports are filed, the
# registers and the front page are live, and digest.md is derived.
[spaces.drafting-table]
path = "drafting-table"
filed = ["drafting-table/rulings.md", "drafting-table/evidence.md",
         "drafting-table/watch-log.md", "drafting-table/blueprints/*/close.md"]

# Live: drops waiting to be sorted, one page each, moved out whole when
# sorted. Not hung (office start carries the unsorted ones itself) and
# not filed (a drop's status line changes, and the page leaves).
[spaces.in-tray]
path = "in-tray"
